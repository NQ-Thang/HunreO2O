version: '3.8'

networks:
  hunre-network:
    driver: bridge

volumes:
  hunre-mysql-data:
  hunre-redis-data:

services:
  # ==========================================
  # DATABASE & CACHE INFRASTRUCTURE
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: hunre-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: hunre_ecommerce
    ports:
      - "3307:3306"
    volumes:
      - hunre-mysql-data:/var/lib/mysql
      - ./shared/database-init/init-schema.sql:/docker-entrypoint-initdb.d/init-schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - hunre-network

  redis:
    image: redis:7-alpine
    container_name: hunre-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - hunre-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - hunre-network

  # ==========================================
  # AUTH MICROSERVICE
  # ==========================================
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: hunre-auth-service
    restart: always
    ports:
      - "8001:8001"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: hunre_ecommerce
      DB_USERNAME: root
      DB_PASSWORD: root
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - hunre-network

  # ==========================================
  # API GATEWAY (NGINX)
  # ==========================================
  gateway:
    image: nginx:alpine
    container_name: hunre-gateway
    restart: always
    ports:
      - "8000:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
    networks:
      - hunre-network
