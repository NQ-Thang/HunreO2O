server {
    listen 80;
    server_name localhost;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # CORS Headers
    add_header 'Access-Control-Allow-Origin' '*' always;
    add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
    add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

    # OPTIONS preflight
    if ($request_method = 'OPTIONS') {
        return 204;
    }

    # Health check endpoint tại gateway
    location /health {
        return 200 '{"status":"UP","gateway":"nginx","service":"hunre-auth"}';
        add_header Content-Type application/json;
    }

    # Auth & Trust Score Service (port 8001)
    location /api/v1/auth {
        proxy_pass http://auth-service:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
        proxy_connect_timeout 5s;
    }

    # Catch-all: 404 JSON cho các route không tồn tại
    location / {
        return 404 '{"success":false,"message":"Route not found. Available: /api/v1/auth/*"}';
        add_header Content-Type application/json;
    }
}
